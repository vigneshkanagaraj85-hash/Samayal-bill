<head>

<title>சமையல் பொருட்கள் பட்டியல்</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F3F6F1;--surface:#FFFFFF;--ink:#16241A;--muted:#5B6B5F;--leaf:#2F6B3F;--leaf-ink:#FFFFFF;--turmeric:#E3A21A;--line:#D5DED6;--field:#F7FAF6;--chip:#EEF3EC;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101712;--surface:#18221B;--ink:#E7EFE8;--muted:#9AAB9E;--leaf:#6FBF82;--leaf-ink:#0D1A10;--turmeric:#F0B840;--line:#2A372D;--field:#1F2B22;--chip:#223026;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101712;--surface:#18221B;--ink:#E7EFE8;--muted:#9AAB9E;--leaf:#6FBF82;--leaf-ink:#0D1A10;--turmeric:#F0B840;--line:#2A372D;--field:#1F2B22;--chip:#223026;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
h1{font-family:"Mukta Malar","Noto Sans Tamil",sans-serif;font-weight:800;font-size:1.5rem;margin:8px 0 2px;line-height:1.3}
h2{font-family:"Mukta Malar","Noto Sans Tamil",sans-serif;font-weight:800;font-size:1.15rem;margin:24px 2px 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.hint{color:var(--muted);margin:0 2px 8px;font-size:.88rem}
.hero{background:var(--leaf);color:var(--leaf-ink);border-radius:18px;padding:18px 16px 16px}
.hero label{display:block;font-weight:600;font-size:1rem;margin-bottom:6px}
.count-row{display:flex;align-items:center;gap:10px}
.count-row button{flex:0 0 52px;height:52px;border-radius:14px;border:2px solid currentColor;background:transparent;color:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit}
#people{flex:1;min-width:0;font-family:"Mukta Malar",sans-serif;font-weight:800;font-size:3rem;text-align:center;background:transparent;border:none;border-bottom:3px solid var(--turmeric);color:inherit;padding:0;line-height:1.2;-moz-appearance:textfield}
#people::-webkit-outer-spin-button,#people::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
.f label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
.f input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink)}
.dcat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px;margin-top:10px}
.dcat h3{margin:0 0 8px;font-size:.95rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.92rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip.preset{border-style:dashed;border-color:var(--turmeric);background:transparent;font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 2px 4px;font-size:.88rem;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
summary{cursor:pointer;padding:13px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary .cnt{font-weight:400;color:var(--muted);font-size:.85rem}
.items{padding:0 14px 10px}
.it{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.it .nm{flex:1;min-width:0}
.it .nm small{display:block;color:var(--turmeric);font-size:.75rem;line-height:1.2}
.it input{width:84px;font:inherit;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
.it.edited input{border-color:var(--turmeric);border-width:2px}
.it .u{width:34px;color:var(--muted);font-size:.85rem}
.it .del{border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px}
.addrow{display:grid;grid-template-columns:1fr 90px 80px;gap:8px;margin-top:8px}
.addrow input,.addrow select{width:100%;min-width:0;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink)}
.addbtn{margin-top:10px;width:100%;border:2px solid var(--leaf);background:transparent;color:var(--leaf);border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.it.zero .nm{color:var(--muted)}
.row-opts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 2px 0;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:6px;font-size:.9rem}
.tog input{width:18px;height:18px;accent-color:var(--leaf)}
.linkbtn{background:none;border:none;color:var(--leaf);font:inherit;font-weight:600;padding:0;cursor:pointer;text-decoration:underline}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);margin-top:10px}
.pv{width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#fff}
.pv-inner{width:794px;transform-origin:top left}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar button{flex:1;border:none;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:1.02rem;background:var(--turmeric);color:#1d1503;cursor:pointer}
.bar button:disabled{opacity:.6;cursor:wait}
#msg{font-size:.85rem;color:var(--muted);flex:0 1 40%}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
#capture{position:fixed;left:-12000px;top:0}

/* printable sheet */
.sheet{width:794px;height:1123px;background:#fff;color:#111;padding:24px 26px 18px;font-family:"Noto Sans Tamil",sans-serif;display:flex;flex-direction:column}
.sh-head{border:2px solid #111;border-bottom:none;padding:8px 12px 6px;text-align:center}
.sh-name{font-family:"Mukta Malar","Noto Sans Tamil",sans-serif;font-weight:800;font-size:25px;line-height:1.25}
.sh-name small{font-size:15px;font-weight:600}
.sh-line{font-weight:700;font-size:14px;line-height:1.45}
.sh-meta{display:flex;flex-wrap:wrap;border:2px solid #111;border-bottom:none;font-size:12.5px}
.sh-meta div{flex:1 1 auto;padding:4px 8px;border-right:1px solid #111}
.sh-meta div:last-child{border-right:none}
.sh-menu{border:2px solid #111;border-bottom:none;font-size:11.5px;padding:4px 8px;line-height:1.45}
.sh-table{border-collapse:collapse;width:100%;flex:1;table-layout:fixed}
.sh-table th{background:#111;color:#fff;font-weight:600;font-size:12.5px;padding:3px 6px;text-align:left;border:1px solid #111}
.sh-table td{border:1px solid #111;font-size:var(--fs,12px);padding:0 6px;height:var(--rh,21px);white-space:nowrap;overflow:hidden}
.sh-table td.q{text-align:right;font-weight:700}
.sh-table td.hd{background:#e6e6e6;font-weight:700}
.sh-foot{font-size:10.5px;text-align:right;margin-top:3px;color:#444}
</style>
</head>
<body>
<div class="wrap">
  <h1>சமையல் பொருட்கள் பட்டியல்</h1>
  <p class="sub">எத்தனை பேர், என்ன உணவுகள் என்று தேர்வு செய்தால் பொருட்களின் அளவு தானாக வரும். எந்த அளவையும் மாற்றலாம்.</p>

  <section class="hero">
    <label for="people">எத்தனை பேருக்கு?</label>
    <div class="count-row">
      <button type="button" id="minus" aria-label="50 குறை">−50</button>
      <input id="people" type="number" inputmode="numeric" min="10" step="10" value="100">
      <button type="button" id="plus" aria-label="50 கூட்டு">+50</button>
    </div>
  </section>

  <h2>என்ன உணவுகள்?</h2>
  <p class="hint">தேவையான உணவுகளை தொடுங்கள். <span id="dishCount"></span></p>
  <div class="presets" id="presets"></div>
  <div id="dishes"></div>

  <h2>பொருட்கள் &amp; அளவு</h2>
  <div class="row-opts">
    <label class="tog"><input type="checkbox" id="showAll"> எல்லா பொருட்களும் காட்டு</label>
    <button type="button" class="linkbtn" id="reset">மாற்றிய அளவுகளை நீக்கு</button>
  </div>
  <div id="sections"></div>
  <section class="card">
    <b>பட்டியலில் இல்லாத பொருள் சேர்</b>
    <div class="addrow">
      <input id="cName" placeholder="பொருள் பெயர் (உ.ம். உளுந்து)" aria-label="பொருள் பெயர்">
      <input id="cQty" type="number" inputmode="decimal" min="0" step="any" placeholder="அளவு" aria-label="அளவு">
      <select id="cUnit" aria-label="அலகு"><option value="kg">கி.கி</option><option value="l">லி</option><option value="n">எண்</option></select>
    </div>
    <label class="tog" style="margin-top:8px"><input type="checkbox" id="cFixed"> நபர்கள் மாறினாலும் இதே அளவு</label>
    <button type="button" class="addbtn" id="cAdd">+ சேர்</button>
    <p class="hint" id="cMsg" style="margin:6px 0 0"></p>
  </section>

  <h2>விவரங்கள்</h2>
  <section class="card" style="margin-top:6px">
    <div class="grid">
      <div class="f"><label for="cust">வாடிக்கையாளர் பெயர்</label><input id="cust" placeholder="பெயர்"></div>
      <div class="f"><label for="evt">விழா</label><input id="evt" placeholder="திருமணம், காதுகுத்து…"></div>
      <div class="f"><label for="dt">தேதி</label><input id="dt" type="date"></div>
      <div class="f"><label for="place">இடம்</label><input id="place" placeholder="ஊர் / மண்டபம்"></div>
    </div>
  </section>
  <details id="cookbox">
    <summary>சமையல்காரர் விவரம் <span class="cnt">PDF தலைப்பு</span></summary>
    <div class="items" style="padding-top:4px">
      <div class="grid">
        <div class="f"><label for="c_name">பெயர்</label><input id="c_name"></div>
        <div class="f"><label for="c_tag">பட்டம்</label><input id="c_tag"></div>
        <div class="f"><label for="c_type">வகை</label><input id="c_type"></div>
        <div class="f"><label for="c_phone">செல்</label><input id="c_phone" inputmode="tel"></div>
      </div>
      <div class="f" style="margin-top:10px"><label for="c_addr">முகவரி</label><input id="c_addr"></div>
    </div>
  </details>

  <h2>PDF முன்னோட்டம்</h2>
  <div class="pv" id="pv"><div class="pv-inner" id="pvInner"></div></div>
</div>

<div class="bar"><div class="in">
  <span id="msg"></span>
  <button type="button" id="pdfBtn">PDF பதிவிறக்கு</button>
</div></div>
<div id="capture" aria-hidden="true"></div>

  ['மில்க் மேய்டு','tin'],['கான்பிளவர்','kg'],['தக்காளி ஜாஸ்','kg'],['சில்லி ஜாஸ்','kg'],['வினிகர்','l'],['தூள் உப்பு','kg'],

const DISH_BY_ID = {}; DISHES.forEach(g => g.d.forEach(d => DISH_BY_ID[d.id] = d));

const UNIT = {kg:'கி', l:'லி', n:'எண்', tin:'டின்'};

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let selected = new Set(store.get('dishes', DEFAULT_SEL).filter(id => DISH_BY_ID[id]));
let edits = store.get('edits2', {});          // item -> amount for 100 people

let customs = store.get('customs', []);   // {id, n, u, b: amount for 100 people (or fixed amount), fixed}
function customQty(c, n){ return c.fixed ? c.b : c.b * n / 100; }
const $ = id => document.getElementById(id);
const ROW_BY_NAME = {}; COLS.flat().forEach(r => { if (!r.h) ROW_BY_NAME[r[0]] = r; });

function people(){ const n = parseInt($('people').value, 10); return isFinite(n) && n > 0 ? n : 0; }
function potPlan(n){
  if (n <= 100) return {p5:1,p4:1,p3:1,p2:1};
  if (n <= 250) return {p8:1,p6:1,p5:1,p4:1,p3:1};
  if (n <= 500) return {p12:1,p10:1,p8:1,p6:1,p5:1};
  if (n <= 1000) return {p18:1,p15:1,p12:1,p10:1,p8:1};
  const k = Math.ceil(n/1000); return {p20:k,p18:k,p15:k,p12:1,p10:1};
}
function dishTotals(){       // item -> amount for 100 people, plus which dishes use it
  const t = {}, by = {};
  // dishes in the same slot (biryani / pulao / rice) share one plate: k dishes → each 1.2/k
  const slotCount = {};
  selected.forEach(id => { const s = DISH_BY_ID[id].s; if (s) slotCount[s] = (slotCount[s] || 0) + 1; });
  selected.forEach(id => {
    const d = DISH_BY_ID[id];
    const k = d.s ? slotCount[d.s] : 1;
    const f = k > 1 ? 1.2 / k : 1;
    Object.entries(d.i).forEach(([key, v]) => { t[key] = (t[key] || 0) + v * f; (by[key] = by[key] || []).push(d.n); });
  });
  return {t, by};
}
let TOT = dishTotals();
function qtyOf(r, n){
  const [name, , vf] = r;
  if (name in edits) return edits[name] * n / 100;
  if (vf){
    if (!n) return 0;
    if (typeof vf === 'string') return potPlan(n)[vf] || 0;
    return Math.ceil(n / vf[0]) * vf[1];
  }
  return (TOT.t[name] || 0) * n / 100;
}
function trimNum(x){ return String(Math.round(x*100)/100); }
function fmt(q, u){
  if (!q || q <= 0) return '';
  if (u === 'kg'){
    if (q < 1){ const g = q*1000; return (g < 50 ? Math.max(1, Math.round(g)) : Math.round(g/10)*10) + ' கிராம்'; }
    return trimNum(Math.round(q*2)/2) + ' கி.கி';
  }
  if (u === 'l'){
    if (q < 1) return Math.max(50, Math.round(q*20)*50) + ' மி.லி';
    return trimNum(Math.round(q*2)/2) + ' லி';
  }
  if (u === 'tin') return Math.ceil(q) + ' டின்';
  return String(Math.ceil(q));
}
function inputVal(q, u){
  if (!q || q <= 0) return '';
  if (u === 'n' || u === 'tin') return String(Math.ceil(q));
  return trimNum(q < 1 ? Math.round(q*1000)/1000 : Math.round(q*100)/100);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderSections(){
  const n = people(), all = $('showAll').checked;
  const openState = {};
  document.querySelectorAll('#sections details').forEach(d => openState[d.dataset.i] = d.open);
  let html = '', anyShown = false;
  GROUPS.forEach((g, gi) => {
    let filled = 0;
    const rows = g.rows.map(r => {
      const q = qtyOf(r, n); if (q > 0) filled++;
      if (!all && !(q > 0) && !(r[0] in edits)) return '';
      const used = TOT.by[r[0]] ? `<small>${esc(TOT.by[r[0]].join(', '))}</small>` : '';
      return `<div class="it${q>0?'':' zero'}${r[0] in edits?' edited':''}"><span class="nm">${esc(r[0])}${used}</span>
        <input type="number" inputmode="decimal" min="0" step="any" value="${inputVal(q, r[1])}" data-name="${esc(r[0])}" aria-label="${esc(r[0])} அளவு">
        <span class="u">${UNIT[r[1]]}</span></div>`;
    }).join('');
    if (!rows) return;
    anyShown = true;
    const open = openState[gi] ?? (gi < 4);
    html += `<details data-i="${gi}"${open?' open':''}><summary>${esc(g.t)} <span class="cnt">${filled} பொருட்கள்</span></summary><div class="items">${rows}</div></details>`;
  });
  if (customs.length){
    anyShown = true;
    const open = openState.c ?? true;
    html += `<details data-i="c"${open?' open':''}><summary>கூடுதல் பொருட்கள் <span class="cnt">${customs.length} பொருட்கள்</span></summary><div class="items">${
      customs.map(c => `<div class="it"><span class="nm">${esc(c.n)}${c.fixed ? '<small>நிலையான அளவு</small>' : ''}</span>
        <input type="number" inputmode="decimal" min="0" step="any" value="${inputVal(customQty(c, n), c.u)}" data-custom="${c.id}" aria-label="${esc(c.n)} அளவு">
        <span class="u">${UNIT[c.u]}</span><button type="button" class="del" data-del="${c.id}" aria-label="${esc(c.n)} நீக்கு">✕</button></div>`).join('')
    }</div></details>`;
  }
  $('sections').innerHTML = anyShown ? html : '<div class="empty">மேலே உணவுகளை தேர்வு செய்யுங்கள், அல்லது "எல்லா பொருட்களும் காட்டு" டிக் செய்து கைமுறையாக அளவு போடுங்கள்.</div>';
}

function menuText(){

// put extra items into the free space of columns 3, 4, 2, 1; add rows only if needed
function sheetCols(n){
  const cols = COLS.map(c => c.slice());
  const items = customs.filter(c => customQty(c, n) > 0);
  if (!items.length) return cols;
  let M = Math.max(...cols.map(c => c.length));
  for (;;){
    const trial = cols.map(c => c.slice()); let i = 0;
    for (const ci of [2, 3, 1, 0]){
      if (i >= items.length) break;
      const free = M - trial[ci].length;
      if (free < 2) continue;
      trial[ci].push({h:'கூடுதல் பொருட்கள்'});
      const take = items.slice(i, i + free - 1);
      take.forEach(c => trial[ci].push({c}));
      i += take.length;
    }
    if (i >= items.length) return trial;
    M++;
  }
}
function sheetHTML(){
  const n = people();
  const dt = $('dt').value ? $('dt').value.split('-').reverse().join('-') : '';
  const cols = sheetCols(n);
  const maxRows = Math.max(...cols.map(c => c.length));
  const rh = maxRows > 36 ? Math.max(13, Math.floor(21 * 37 / (maxRows + 1))) : 21;
  const fs = rh < 19 ? Math.max(9, Math.round(rh * 0.58)) : 12;
  let body = '';
  for (let i = 0; i < maxRows; i++){
    body += '<tr>' + cols.map(c => {
      const r = c[i];
      if (!r) return '<td></td><td></td>';
      if (r.h) return `<td class="hd" colspan="2">${esc(r.h)}</td>`;
      if (r.c) return `<td>${esc(r.c.n)}</td><td class="q">${esc(fmt(customQty(r.c, n), r.c.u))}</td>`;
      return `<td>${esc(r[0])}</td><td class="q">${esc(fmt(qtyOf(r, n), r[1]))}</td>`;
    }).join('') + '</tr>';

  const menu = menuText();
  return `<div class="sheet">

      <div class="sh-name">${esc(cook.name)} <small>${esc(cook.tag)}</small></div>
      <div class="sh-line">${esc(cook.type)}</div>

      <div><b>விழா:</b> ${esc($('evt').value)}</div>
      <div><b>இடம்:</b> ${esc($('place').value)}</div>
      <div><b>தேதி:</b> ${esc(dt)}</div>
      <div><b>நபர்கள்:</b> ${n}</div>
    </div>
    ${menu ? `<div class="sh-menu"><b>மெனு:</b> ${esc(menu)}</div>` : ''}
    <table class="sh-table" style="--rh:${rh}px;--fs:${fs}px">
      <colgroup>${'<col style="width:15%"><col style="width:10%">'.repeat(4)}</colgroup>
      <thead><tr>${'<th>பொருட்கள்</th><th>அளவு</th>'.repeat(4)}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="sh-foot">அளவுகள் தோராயமானவை</div>
  </div>`;
}

// ---------- saving the PDF: Android app → share sheet; claude.ai → downloads; browser → link ----------
let downloadsP = null;
function getDownloads(){
  if (!downloadsP) downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return downloadsP;
}
function blobToBase64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
async function savePdf(blob, filename){
  const P = window.Capacitor && window.Capacitor.Plugins;
  if (P && P.Filesystem){
    const data = await blobToBase64(blob);
    try { await P.Filesystem.writeFile({path: filename, data, directory: 'DOCUMENTS'}); } catch (e) {}
    const w = await P.Filesystem.writeFile({path: filename, data, directory: 'CACHE'});
    try { await P.Share.share({title: filename, files: [w.uri]}); } catch (e) {}
    return;
  }
  const dl = await getDownloads();
  if (dl) { await dl.save({filename, data: blob}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
$('pdfBtn').onclick = async () => {
  const btn = $('pdfBtn'), msg = $('msg');
  if (!people()) { msg.textContent = 'நபர்கள் எண்ணிக்கையை போடுங்கள்.'; return; }
  btn.disabled = true; msg.textContent = 'PDF தயாராகிறது…';
  try {
    const cap = $('capture'); cap.innerHTML = sheetHTML();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(cap.firstElementChild, {scale:2, backgroundColor:'#ffffff'});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:'p', unit:'mm', format:'a4'});
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    const blob = pdf.output('blob');
    cap.innerHTML = '';
    const d = $('dt').value || new Date().toISOString().slice(0,10);
    await savePdf(blob, `samayal-list-${people()}-per-${d}.pdf`);
    msg.textContent = 'PDF தயார்.';
  } catch (e) {
    msg.textContent = e && e.code === 'declined' ? 'சேமிப்பு ரத்து செய்யப்பட்டது.' : 'PDF உருவாக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.';
  } finally { btn.disabled = false; }
};
